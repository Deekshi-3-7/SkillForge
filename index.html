<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020505" />
    <meta name="description" content="Small learning. Daily consistency. Visible growth." />
    <title>SkillForge — Learn a little, every day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      try {
        const theme = localStorage.getItem('skillforge-theme')
        document.documentElement.dataset.theme = theme === 'arctic' || theme === 'violet' ? theme : 'emerald'
      } catch { document.documentElement.dataset.theme = 'emerald' }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
